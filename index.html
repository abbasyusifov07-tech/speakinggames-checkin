*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;padding:18px;color:#111827}
.app{max-width:540px;margin:auto}
.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:58px;height:58px;border-radius:16px;object-fit:cover}
h1{font-size:24px;margin:0}.sub{font-size:13px;color:#6b7280;margin-top:4px}
input,button{width:100%;padding:13px;border-radius:11px;font-size:16px}
input{border:1px solid #d9dee8;margin-top:10px}
button{border:0;background:#111827;color:#fff;font-weight:800;margin-top:9px}
#reader{margin-top:15px;overflow:hidden;border-radius:15px}
.result{margin-top:15px;padding:16px;border-radius:14px;display:none;white-space:pre-line;font-weight:600}
.success{background:#e6f7ec;color:#145c2e}.warn{background:#fff4d3;color:#7a5700}.bad{background:#fde8e8;color:#8c1d1d}
.tip{font-size:12px;color:#6b7280;margin-top:10px;line-height:1.45}
</style>

<div><h1>SpeakingGames Check-in</h1><div class="sub">Scan each guest ticket once</div></div>
</div>

<input id="host" placeholder="Host name">
<div id="reader"></div>

<input id="manual" placeholder="Or enter Ticket ID manually">
<button onclick="manualCheck()">CHECK IN</button>

<div id="result" class="result"></div>
<div class="tip">The host name is saved on this device after the first successful scan.</div>
</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwhoPcaTTaoyP_z5a7tmvHHUNA4UOu3SNbRDnbECPB0OdY7Q71b1yEFVSUvzD9IjjZw/exec";
let busy=false;
let scanner=null;

const savedHost=localStorage.getItem('sg_host_name');
if(savedHost) document.getElementById('host').value=savedHost;

function show(res){
  const el=document.getElementById('result');
  el.style.display='block';
  el.className='result '+(res.ok?'success':(res.type==='duplicate'?'warn':'bad'));

  let text=res.message||'';
  if(res.ticket){
    text+='\n\nName: '+(res.ticket.name||'')+
      '\nTicket: '+(res.ticket.ticketId||'')+
      '\nEvent: '+(res.ticket.event||'')+
      '\nDate: '+(res.ticket.date||'')+
      '\nTime: '+(res.ticket.time||'')+
      '\nStatus: '+(res.ticket.status||'');
    if(res.ticket.checkinTime) text+='\nChecked in: '+res.ticket.checkinTime;
  }
  el.textContent=text;

  if(res.ok){
    const h=document.getElementById('host').value.trim();
    if(h) localStorage.setItem('sg_host_name',h);
    if(navigator.vibrate) navigator.vibrate(140);
    beep();
  }
}

function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value=880;
    gain.gain.value=0.05;
    osc.start();
    setTimeout(()=>{osc.stop();ctx.close();},120);
  }catch(e){}
}

async function sendCheckIn(ticketId){
  if(busy) return;

  const hostName=document.getElementById('host').value.trim();
  if(!hostName){
    show({ok:false,type:'validation',message:'Please enter the host name first.'});
    return;
  }

  busy=true;

  try{
    const response=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({
        action:'checkIn',
        ticketId:String(ticketId||'').trim(),
        hostName:hostName
      })
    });

    const data=await response.json();
    show(data);
  }catch(err){
    show({ok:false,type:'error',message:'Connection error: '+err.message});
  }

  setTimeout(()=>busy=false,1800);
}

function manualCheck(){
  sendCheckIn(document.getElementById('manual').value.trim());
}

function onScanSuccess(decodedText){
  let id=String(decodedText||'').trim();

  try{
    const u=new URL(id);
    id=u.searchParams.get('id')||id;
  }catch(e){}

  sendCheckIn(id);
}

async function startCamera(){
  scanner=new Html5Qrcode('reader');

  try{
    await scanner.start(
      {facingMode:'environment'},
      {fps:10,qrbox:{width:250,height:250},aspectRatio:1.0},
      onScanSuccess
    );
    return;
  }catch(firstErr){}

  try{
    const cams=await Html5Qrcode.getCameras();
    if(!cams || !cams.length) throw new Error('No camera found.');

    const rear=cams.find(c=>/back|rear|environment/i.test(c.label));
    const chosen=rear?rear.id:cams[cams.length-1].id;

    await scanner.start(
      chosen,
      {fps:10,qrbox:{width:250,height:250},aspectRatio:1.0},
      onScanSuccess
    );
  }catch(err){
    show({ok:false,type:'camera',message:'Camera error: '+err});
  }
}

startCamera();
</script>
